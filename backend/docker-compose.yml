# Local development: `docker compose up -d db`, then `npm run start:dev`.
# Everything in containers: `docker compose up -d --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: words
      POSTGRES_PASSWORD: words
      POSTGRES_DB: words
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U words']
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://words:words@db:5432/words
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
